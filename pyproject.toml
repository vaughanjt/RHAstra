[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhastra"
version = "0.2.0"
description = "An inverse-spectral research scaffold for the Riemann hypothesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mpmath>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["rhastra*"]
